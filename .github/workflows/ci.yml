name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/arabic-sentiment-mlops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install CI tools
        run: |
          pip install ruff
          pip install dvc[http]

      - name: Lint
        run: ruff check src tests

      - name: Syntax check
        run: |
          python -m py_compile src/arabic_sentiment/api.py
          python -m py_compile src/arabic_sentiment/preprocessing.py
          python -m py_compile src/arabic_sentiment/config.py

      - name: Run tests
        run: python -m pytest tests/test_api_unit.py -v

      - name: Configure DVC credentials
        run: |
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user MohamedX86
          dvc remote modify --local dagshub password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull DVC artifacts
        run: dvc pull

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}